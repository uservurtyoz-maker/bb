name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Распаковать архив, если проект лежит в zip
        run: |
          if [ -f BlockHelper.zip ]; then unzip -o BlockHelper.zip; fi
          ls -la

      - name: Сборка APK
        run: |
          F=$(find . -name "settings.gradle.kts" -not -path "./.git/*" | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle.kts не найден"; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BlockHelper-apk
          path: "**/app-debug.apk"
